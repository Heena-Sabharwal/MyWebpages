<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#ffffff" />
		<title>Basketball Score</title>
        <link rel="stylesheet" href="style_BB.css" />
	</head>
	<body>
		<main>
			<h1>Basketball Score</h1>
            <div class="scoreboard">
                <div class="score-sections">
                    <h2>HOME</h2>
                    <p id="home-score">0</p>
                    <div class="buttons">
                        <button id="home-add-1">+1</button>
                        <button id="home-add-2">+2</button>
                        <button id="home-add-3">+3</button>
                    </div>
                </div>
                <div class="score-sections">
                    <h2>AWAY</h2>
                    <p id="away-score">0</p>
                    <div class="buttons">
                        <button id="away-add-1">+1</button>
                        <button id="away-add-2">+2</button>
                        <button id="away-add-3">+3</button>
                    </div>
                </div>
            </div>
		</main>
	</body>
</html>
